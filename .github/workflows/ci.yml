name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
        env:
          PDFA_OUT: test-results/pdfa
      - name: Server tests
        run: npm run test:server
      - run: npm run build
      - name: PDF/A-3 check with veraPDF
        run: docker run --rm -v "$PWD/test-results/pdfa:/data" verapdf/cli:latest --flavour 3b --format text /data/zugferd.pdf /data/long-en.pdf /data/reminder.pdf | tee verapdf.txt && ! grep -q '^FAIL' verapdf.txt
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (server + built app)
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kontor .
      - name: Smoke test
        run: |
          docker run -d --name kontor -p 8787:8787 -e COOKIE_SECURE=false kontor
          for i in $(seq 1 20); do curl -fs http://localhost:8787/api/health && break; sleep 1; done
          curl -fs http://localhost:8787/ | grep -q '<div id="root">'
          docker rm -f kontor
